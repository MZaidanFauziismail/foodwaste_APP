name: Android APK Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        working-directory: GrandeButera/flutter_app
        run: flutter pub get

      - name: Build release APK
        working-directory: GrandeButera/flutter_app
        run: |
          flutter build apk --release \
            --dart-define=API_BASE_URL=https://foodwasteapp-production-6eaa.up.railway.app/api

      - name: Prepare APK
        run: |
          mkdir -p release
          cp GrandeButera/flutter_app/build/app/outputs/flutter-apk/app-release.apk \
            release/ShareBite-${GITHUB_REF_NAME}.apk

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "release/ShareBite-${GITHUB_REF_NAME}.apk" \
            --title "ShareBite ${GITHUB_REF_NAME}" \
            --notes "Release APK ShareBite ${GITHUB_REF_NAME}"
