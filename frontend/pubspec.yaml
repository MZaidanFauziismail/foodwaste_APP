name: ecoshare_app
description: Fullstack EcoShare mobile frontend connected to ExpressJS, PostgreSQL, and ML service.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_map: ^7.0.2
  http: ^1.2.2
  intl: ^0.19.0
  latlong2: ^0.9.1
  geolocator: ^13.0.2
  firebase_core: ^3.8.1
  firebase_auth: ^5.3.4
  firebase_messaging: ^15.1.6
  provider: ^6.1.2
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
